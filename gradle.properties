# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

# Enable parallel execution for multi-module builds.
# Modules that are independent of each other will build simultaneously,
# significantly reducing overall build time on multi-core machines.
org.gradle.parallel=true

# Enable parallel Gradle sync in Android Studio/IntelliJ.
# Allows the IDE to sync multiple modules concurrently during project import
# or Gradle file changes, speeding up the sync process.
org.gradle.tooling.parallel=true

# Enables the Gradle daemon to run as a background process.
# Keeps Gradle running in memory between builds to reduce startup time.
# Greatly improves build speed for subsequent builds.
org.gradle.daemon=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
# For more information, visit:
# https://developer.android.com/topic/libraries/support-library/androidx-rn
# REQUIRED for modern Android development. Migrates from old support library to AndroidX.
android.useAndroidX=true

# Disables namespaced R classes (R classes are merged across all modules).
# All R classes accessible from anywhere without worrying about correct imports
android.nonTransitiveRClass=false

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Enables full optimization mode for R8 (ProGuard replacement).
# In full mode, R8 performs more aggressive optimizations.
android.enableR8.fullMode=true

# Key and Alias of the release key
# Replace 'your_release_key_password' with the actual password of your release key.
# Replace 'your_key_alias' with the alias of your release key.
# Replace 'your_store_password' with the password of your keystore file.
RELEASE_KEY_PASSWORD=YOUR_ANDROID_KEY
RELEASE_KEY_ALIAS=YOUR_KEY_ALIAS
RELEASE_STORE_PASSWORD=YOUR_PASSWORD